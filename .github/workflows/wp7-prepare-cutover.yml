name: WP7 prepare legacy redirects

on:
  workflow_dispatch:
  push:
    branches:
      - feat/wp7-redirect-cutover
    paths:
      - 'migration/legacy-routes.yaml'
      - 'scripts/wp7-redirects.mjs'
      - '.github/workflows/wp7-prepare-cutover.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout legacy NCUTAM site
        uses: actions/checkout@v5
        with:
          path: source
          ref: feat/wp7-redirect-cutover
          fetch-depth: 0

      - name: Checkout target Inmech feature branch
        uses: actions/checkout@v5
        with:
          repository: mfs9697/inmech-site
          ref: feat/ncutam-wp6-infrastructure
          path: target-site

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: target-site/package-lock.json

      - name: Build target NCUTAM section
        working-directory: target-site
        run: |
          npm ci
          npm run build

      - name: Validate map and generate redirect stubs
        working-directory: source
        run: node scripts/wp7-redirects.mjs --target-dir=../target-site/dist --apply --check-generated

      - name: Commit prepared cutover files
        working-directory: source
        run: |
          if git diff --quiet; then
            echo 'Redirect stubs are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Prepare NCUTAM legacy URL cutover stubs'
          git push origin HEAD:feat/wp7-redirect-cutover
